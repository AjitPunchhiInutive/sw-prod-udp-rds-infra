name: Terragrunt Action Workflow Prod

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Add permissions if the reusable workflow needs them
permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  terragrunt-job:
    name: Deploy Terragrunt to Production
    uses: AjitPunchhiInutive/sw-prod-udp-rds-infra/.github/workflows/terragrunt-folders-workflow.yml@main
    with:
      # Use snake_case (working_directory) not camelCase (workingDirectory)
      working_directory: 'projects'
      environment: 'prod'
      terraform_version: '1.6.0'
      action: 'plan'